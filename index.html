<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GreenTech Bank</title>
<style>
:root{--g:#2e9e3a;--t:#0e8a86;--y:#f5b400;--tx:#17332a}
*{box-sizing:border-box;margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif}
body{background:linear-gradient(160deg,#e8f7ec,#dff3f2);color:var(--tx);min-height:100vh;overflow-x:hidden;transition:background .6s}
body.adm{background:linear-gradient(160deg,#0f2a2e,#12404a)}
.fx i{position:fixed;top:-40px;font-style:normal;animation:fall linear infinite;opacity:.4;z-index:0;pointer-events:none}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes pulse{50%{transform:scale(1.15);box-shadow:0 0 22px #f5b400aa}}
@keyframes pop{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
#root{position:relative;z-index:2}
.logo,header img{width:130px;border-radius:50%;animation:float 3s ease-in-out infinite;box-shadow:0 8px 24px #0e8a8633}
header{text-align:center;padding:18px 12px 4px}header p{margin-top:6px}
nav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:10px}
nav button,aside button{border:0;padding:10px 18px;border-radius:30px;background:#fff;color:var(--t);font-weight:600;cursor:pointer;transition:.25s;box-shadow:0 2px 8px #0001}
nav button:hover{transform:translateY(-3px)}
nav button.on,aside button.on{background:linear-gradient(90deg,var(--g),var(--t));color:#fff}
.out{color:#d9534f!important}
main{max-width:900px;margin:auto;padding:10px 14px 50px;animation:pop .5s}
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.lg{width:100%;max-width:400px;text-align:center}.lg .logo{margin-bottom:8px}.lg label{text-align:left}
.seg{display:flex;background:#e3f0e8;border-radius:30px;padding:4px;margin:10px 0}
.seg button{flex:1;border:0;padding:10px;border-radius:30px;background:none;font-weight:700;cursor:pointer;color:var(--t);transition:.3s}
.seg button.on{background:linear-gradient(90deg,var(--g),var(--t));color:#fff;box-shadow:0 4px 12px #0e8a8644}
.w{width:100%}.sw{margin-top:14px;color:var(--t);font-weight:600;cursor:pointer;font-size:14px}.hint{margin-top:12px;font-size:12px;color:#789;line-height:1.6}
.card{background:#fffffff2;border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 6px 24px #0e8a8618;animation:pop .5s both}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.stat{color:#fff;border-radius:20px;padding:20px;position:relative;overflow:hidden;animation:pop .6s both;transition:.3s}
.stat:hover{transform:translateY(-5px) scale(1.02)}.stat b{font-size:28px;display:block;margin-top:6px}
.s1{background:linear-gradient(135deg,#2e9e3a,#58c35f)}.s2{background:linear-gradient(135deg,#0e8a86,#2bb5ae)}.s3{background:linear-gradient(135deg,#e29f00,#f5c63a)}.s4{background:linear-gradient(135deg,#4a5fd0,#7a8cf0)}
.stat .ic{position:absolute;right:12px;top:8px;font-size:38px;opacity:.35;animation:float 2.5s infinite}
.coin{display:inline-block;width:34px;height:34px;line-height:34px;border-radius:50%;background:radial-gradient(#ffd84d,#e0a200);color:#fff;text-align:center;animation:pulse 2s infinite}
h2{margin-bottom:12px;color:var(--t)}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:14px}
input,select{width:100%;padding:12px;border:2px solid #cfe9dc;border-radius:12px;font-size:15px;transition:.2s}
input:focus,select:focus{outline:0;border-color:var(--g);box-shadow:0 0 0 4px #2e9e3a22}
.btn{margin-top:16px;border:0;padding:13px 22px;border-radius:14px;color:#fff;font-weight:700;font-size:15px;cursor:pointer;background:linear-gradient(90deg,var(--g),var(--t));transition:.25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px #0e8a8644}
.btn.sm{margin:0 4px 0 0;padding:7px 12px;font-size:13px}.btn.red{background:#d9534f}
.prev{margin-top:12px;padding:12px;border-radius:12px;background:#eaf8ee;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid #e3f0e8;flex-wrap:wrap;animation:pop .4s both}
.tag{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
.Menunggu{background:#fff3cd;color:#8a6500}.Diterima,.Dicairkan{background:#d4f4dd;color:#1d7a2d}.Ditolak{background:#fde0df;color:#b02a27}
.rate{display:flex;gap:8px;flex-wrap:wrap}.rate span{background:#eaf8ee;padding:8px 12px;border-radius:12px;font-size:13px;transition:.2s}.rate span:hover{background:#d4f4dd;transform:scale(1.06)}
.bar{height:14px;border-radius:8px;background:linear-gradient(90deg,var(--g),var(--t));width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.aw{display:flex;min-height:100vh}
aside{width:230px;padding:22px 14px;background:#0a1e22cc;backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:8px;color:#fff;text-align:center}
aside img{width:90px;border-radius:50%;margin:auto;animation:float 3s infinite}aside small{opacity:.6;margin-bottom:10px}
aside button{border-radius:12px;text-align:left;background:#ffffff14;color:#cdeee9;box-shadow:none}aside button:hover{background:#ffffff2a}
.aw main{flex:1;max-width:none;margin:0;padding:22px}
.aw .card h2{color:#12404a}
@media(max-width:700px){.aw{flex-direction:column}aside{width:100%}}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,100px);background:var(--t);color:#fff;padding:13px 24px;border-radius:30px;transition:.4s;z-index:9;font-weight:600}
#toast.show{transform:translate(-50%,0)}
.empty{text-align:center;color:#789;padding:16px}.spin{display:inline-block;animation:spin 6s linear infinite}
</style></head><body>

<p style="margin-top:12px;font-size:14px">1 poin = ${rp(NILAI)} · Minimal pencairan ${MIN} poin (${rp(MIN*NILAI)})</p>${ps?`<p style="margin-top:8px;font-size:14px">⏳ ${ps} transaksi menunggu verifikasi admin.</p>`:""}</div>`},
setor(){return`<div class="card"><h2>♻️ Setor Sampah Plastik</h2><label>Jenis plastik</label><select id="j" onchange="pv()">${Object.keys(JENIS).map(j=>`<option>${j}</option>`)}</select>
<label>Berat (kg)</label><input id="b" type="number" min="0.1" step="0.1" placeholder="contoh: 2.5" oninput="pv()"><div class="prev" id="pv">Masukkan berat untuk melihat estimasi poin</div><button class="btn" onclick="setor()">Kirim Setoran 🚀</button></div>`},
tukar(){return`<div class="card"><h2>💰 Cairkan Poin</h2><p>Saldo: <span class="coin">★</span> <b>${poin(S)} poin</b> (${rp(poin(S)*NILAI)})</p>
<label>Jumlah poin (min ${MIN})</label><input id="tp" type="number" oninput="pt()" placeholder="contoh: 400"><label>Metode pencairan</label><select id="tm"><option>DANA</option><option>OVO</option><option>GoPay</option><option>Transfer Bank</option><option</option></select>
<label>No. rekening / e-wallet</label><input id="tn" placeholder="08xxxxxxxxxx"><div class="prev" id="pt">Uang diterima: Rp0</div><button class="btn" onclick="tarik()">Ajukan Pencairan 💸</button></div>`},
riwayat(){const a=[...D.setor.filter(s=>s.u==S).map(s=>({...s,k:"s"})),...D.tarik.filter(t=>t.u==S).map(t=>({...t,k:"t"}))].sort((x,y)=>y.id-x.id);
return`<div class="card"><h2>📜 Riwayat Transaksi</h2>${a.length?a.map(x=>x.k=="s"?`<div class="row"><div>♻️ <b>${x.jenis}</b> ${x.kg} kg<br><small>${x.tgl}</small></div><div>+${x.poin} poin <span class="tag ${x.st}">${x.st}</span></div></div>`:`<div class="row"><div>💸 <b>Cairkan ke ${x.metode}</b> (${x.no})<br><small>${x.tgl}</small></div><div>-${x.poin} poin · ${rp(x.rp)} <span class="tag ${x.st}">${x.st}</span></div></div>`).join(""):empty("Belum ada transaksi 🌱")}</div>`},
dash(){const ns=D.users.filter(x=>x.role=="nasabah"),ok=D.setor.filter(s=>s.st=="Diterima"),mx=Math.max(1,...Object.keys(JENIS).map(j=>sum(ok.filter(s=>s.jenis==j),s=>s.kg)));
return`<div class="grid">${stat("s4","👥","Total Nasabah",ns.length,"i")}${stat("s1","♻️","Plastik Terkumpul",sum(ok,s=>s.kg),"k")}${stat("s3","⏳","Menunggu Verifikasi",D.setor.filter(s=>s.st=="Menunggu").length+D.tarik.filter(t=>t.st=="Menunggu").length,"i")}${stat("s2","💸","Dana Dicairkan",sum(D.tarik.filter(t=>t.st=="Dicairkan"),t=>t.rp),"r")}</div><br>
<div class="card"><h2>📊 Plastik Terkumpul per Jenis</h2>${Object.keys(JENIS).map(j=>{const v=sum(ok.filter(s=>s.jenis==j),s=>s.kg);return`<div style="margin:10px 0"><small>${j} — <b>${v.toFixed(1)} kg</b></small><div class="bar" data-w="${v/mx*100}"></div></div>`}).join("")}</div>`},
asetor(){const s=D.setor.filter(x=>x.st=="Menunggu");return`<div class="card"><h2>♻️ Verifikasi Setoran</h2>${s.length?s.map(x=>`<div class="row"><div><b>${nama(x.u)}</b> · ${x.jenis} ${x.kg} kg → ${x.poin} poin<br><small>${x.tgl}</small></div><div><button class="btn sm" onclick="ok('s',${x.id},1)">Terima</button><button class="btn sm red" onclick="ok('s',${x.id},0)">Tolak</button></div></div>`).join(""):empty("Tidak ada setoran menunggu ✅")}</div>`},
atarik(){const t=D.tarik.filter(x=>x.st=="Menunggu");return`<div class="card"><h2>💸 Pencairan Dana</h2>${t.length?t.map(x=>`<div class="row"><div><b>${nama(x.u)}</b> · ${x.poin} poin → <b>${rp(x.rp)}</b><br><small>${x.metode} ${x.no}</small></div><div><button class="btn sm" onclick="ok('t',${x.id},1)">Cairkan</button><button class="btn sm red" onclick="ok('t',${x.id},0)">Tolak</button></div></div>`).join(""):empty("Tidak ada pencairan menunggu ✅")}</div>
<button class="btn red" onclick="if(confirm('Hapus semua transaksi?')){D.setor=[];D.tarik=[];save();render()}">Reset Transaksi Demo</button>`},
anasabah(){const n=D.users.filter(x=>x.role=="nasabah");return`<div class="card"><h2>👥 Data Nasabah</h2>${n.map(x=>`<div class="row"><div><b>${x.nama}</b><br><small>@${x.u}</small></div><div style="text-align:right">${poin(x.u)} poin · ${kg(x.u).toFixed(1)} kg<br><small>Dicairkan ${rp(cair(x.u))}</small></div></div>`).join("")}</div>`}};
function loginView(){const up=mode=="up"&&peran=="nasabah";return`<div class="login"><div class="card lg"><img class="logo" src="${LOGO}" alt="GreenTech Bank">
<div class="seg"><button class="${peran=="nasabah"?"on":""}" onclick="peran='nasabah';render()">👤 Nasabah</button><button class="${peran=="admin"?"on":""}" onclick="peran='admin';mode='in';render()">🛠️ Admin</button></div>
${up?`<label>Nama lengkap</label><input id="nm">`:""}<label>Username</label><input id="u" autocomplete="off"><label>Password</label><input id="p" type="password" onkeydown="if(event.key=='Enter')auth()">
<button class="btn w" onclick="auth()">${up?"Daftar Sekarang":"Masuk"}</button>
${peran=="nasabah"?`<p class="sw" onclick="mode=mode=='in'?'up':'in';render()">${up?"Sudah punya akun? Masuk":"Belum punya akun? Daftar"}</p>`:""}
<p class="hint">Akun demo — Nasabah: <b>nasabah / 123456</b><br>Admin: <b>admin / admin123</b></p></div></div>`}
function auth(){const u=val("u").trim().toLowerCase(),p=val("p");if(!u||!p)return toast("Lengkapi username dan password");
if(mode=="up"&&peran=="nasabah"){const nm=val("nm").trim();if(!nm||p.length<4)return toast("Isi nama & password minimal 4 karakter");if(D.users.some(x=>x.u==u))return toast("Username sudah dipakai");D.users.push({u,p,nama:nm,role:"nasabah"});S=u;tab="home"}
else{const x=D.users.find(x=>x.u==u&&x.p==p&&x.role==peran);if(!x)return toast("Username/password salah atau peran tidak sesuai");S=u;tab=peran=="admin"?"dash":"home"}
save();toast("Selamat datang! 🌿");render()}
function logout(){S=null;mode="in";save();render()}
function go(k){tab=k;render()}
function render(){const r=document.getElementById("root"),m=S&&me();
if(!m){document.body.className="";r.innerHTML=loginView();return}
const adm=m.role=="admin";document.body.className=adm?"adm":"";if(!V[tab])tab=adm?"dash":"home";
const menu=(adm?ATABS:NTABS).map(([k,l])=>`<button class="${k==tab?"on":""}" onclick="go('${k}')">${l}</button>`).join("")+`<button class="out" onclick="logout()">🚪 Keluar</button>`;
r.innerHTML=adm?`<div class="aw"><aside><img src="${LOGO}"><b>${m.nama}</b><small>Panel Admin</small>${menu}</aside><main>${V[tab]()}</main></div>`:`<header><img src="${LOGO}"><p>Halo, <b>${m.nama}</b> 👋</p></header><nav>${menu}</nav><main>${V[tab]()}</main>`;
r.querySelectorAll("[data-n]").forEach(e=>count(e,+e.dataset.n,FM[e.dataset.f]));
setTimeout(()=>r.querySelectorAll("[data-w]").forEach(e=>e.style.width=e.dataset.w+"%"),60)}
function pv(){const b=+val("b"),p=Math.round(b*JENIS[val("j")]);document.getElementById("pv").innerHTML=b>0?`Estimasi: <b>${p} poin</b> ≈ ${rp(p*NILAI)} 🪙`:"Masukkan berat untuk melihat estimasi poin"}
function setor(){const b=+val("b"),j=val("j");if(!(b>0))return toast("Isi berat sampah dulu ya");D.setor.push({id:Date.now(),u:S,jenis:j,kg:b,poin:Math.round(b*JENIS[j]),st:"Menunggu",tgl:tgl()});save();toast("Setoran terkirim, menunggu verifikasi 🌿");go("riwayat")}
function pt(){document.getElementById("pt").textContent="Uang diterima: "+rp((+val("tp")||0)*NILAI)}
function tarik(){const p=+val("tp"),n=val("tn").trim(),m=val("tm");if(p<MIN)return toast("Minimal pencairan "+MIN+" poin");if(p>poin(S))return toast("Saldo poin tidak cukup");if(!n&&m!="Tunai di Kantor")return toast("Isi nomor tujuan");
D.tarik.push({id:Date.now(),u:S,poin:p,rp:p*NILAI,metode:m,no:n||"-",st:"Menunggu",tgl:tgl()});save();toast("Pengajuan pencairan terkirim 💸");go("riwayat")}
function ok(k,id,y){const x=(k=="s"?D.setor:D.tarik).find(i=>i.id==id);x.st=y?(k=="s"?"Diterima":"Dicairkan"):"Ditolak";save();toast(y?"Disetujui ✅":"Ditolak");render()}
const fx=document.getElementById("fx");["♻️","🍃","🧴","🌱","🪙"].forEach(e=>{for(let j=0;j<4;j++){const s=document.createElement("i");s.textContent=e;s.style.cssText=`left:${Math.random()*100}%;font-size:${16+Math.random()*18}px;animation-duration:${9+Math.random()*10}s;animation-delay:-${Math.random()*15}s`;fx.appendChild(s)}});
render();
</script></body></html>
